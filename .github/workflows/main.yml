name: Publish Zabancheh

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Unpack the app
        run: |
          mkdir -p _site
          for z in zabancheh-web-*.zip; do unzip -q -o "$z" -d _site; done
          touch _site/.nojekyll
          echo "files: $(find _site -type f | wc -l)"

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
